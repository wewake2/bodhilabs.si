<!doctype html>
<html lang="en"><head><meta charset="utf-8">
<link rel="stylesheet" href="../brand/tokens.css">
<style>
@font-face { font-family: "Newsreader"; font-weight: 400; src: url("../fonts/newsreader-display.woff2") format("woff2"); }
@font-face { font-family: "Inter"; font-weight: 400; src: url("../fonts/inter-400.woff2") format("woff2"); }
@font-face { font-family: "Geist Mono"; font-weight: 500; src: url("../fonts/geistmono-500.woff2") format("woff2"); }
html, body { margin: 0; width: 1200px; height: 630px; overflow: hidden; }
body { background: var(--bg); color: var(--ink); font-family: var(--font-body); display: grid; grid-template-rows: auto 1fr auto; padding: 64px 72px; box-sizing: border-box; }
.top img { height: 44px; }
h1 { font-family: var(--font-display); font-weight: 400; font-size: 118px; line-height: 1; letter-spacing: -0.01em; margin: 0; align-self: center; }
h1 .d { color: var(--accent); }
.bottom { display: flex; justify-content: space-between; align-items: baseline; font-family: var(--font-mono); font-weight: 500; font-size: 20px; letter-spacing: 0.08em; text-transform: uppercase; color: var(--ink-2); border-top: 1px solid var(--line); padding-top: 24px; }
</style></head>
<body>
  <div class="top"><img src="../brand/logo/bodhi-lockup-color.svg" alt=""></div>
  <h1>Structure<span class="d">.</span> Resolve<span class="d">.</span> Prove<span class="d">.</span></h1>
  <div class="bottom"><span>The data layer AI depends on</span><span>500M+ documents · 1.5 PB · India and the US</span></div>
</body></html>
